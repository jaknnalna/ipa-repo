name: Publish IPA
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
      bid:
        required: true
      ver:
        required: true
      name:
        required: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: Join parts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEF: ${{ github.event.repository.default_branch }}
          BR: ${{ inputs.branch }}
          BID: ${{ inputs.bid }}
          VER: ${{ inputs.ver }}
          NAME: ${{ inputs.name }}
        run: |
          set -e
          cat "parts/$BID/$VER/$NAME".part* > "/tmp/$NAME"
          tag="v${VER}-${BID}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$BID $VER" --notes "" --target "$DEF"
          gh release upload "$tag" "/tmp/$NAME" --clobber
          git push origin --delete "$BR"
